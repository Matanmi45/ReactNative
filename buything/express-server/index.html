<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="submit">Submit</button>
    <button id="profile">Get Profile</button>

    <script>
      const btn = document.getElementById("submit");
      const profileBtn = document.getElementById("profile");
      let token = "";

      btn.addEventListener("click", async (e) => {
        const res = await fetch("http://localhost:5555/auth/sign-in", {
          method: "POST",
          body: JSON.stringify({
            name: "Niraj",
            email: "niraj1@email.com",
            password: "123456",
          }),
          headers: {
            "Content-Type": "application/json",
          },
        });

        if (!res.ok) {
          const errorRes = await res.json();
          console.log(errorRes.error);
        } else {
          const successRes = await res.json();
          console.log(successRes);
          token = successRes.token;
        }
      });

      profileBtn.addEventListener("click", async (e) => {
        const res = await fetch("http://localhost:5555/auth/is-auth", {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
          },
        });

        if (!res.ok) {
          const errorRes = await res.json();
          console.log(errorRes.error);
        } else {
          console.log(await res.json());
        }
      });
    </script>
  </body>
</html>
